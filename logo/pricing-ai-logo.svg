  <text x="250" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#0F172A" letter-spacing="-1">Pricing<tspan fill="url(#txt)" dx="16">AI</tspan></text>
  <text x="254" y="185" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#64748B" letter-spacing="6">SMART AUTO QUOTING</text>
