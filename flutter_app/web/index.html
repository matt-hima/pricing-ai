<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pricing AI: pick platforms and features, and an AI model running in your browser estimates the price range, man-month breakdown and maintenance fee, then builds a PDF quotation. Test estimate, for reference only.">
  <link rel="canonical" href="https://pricingai.minervaelectronics.com/app/">
  <meta name="robots" content="noindex, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pricing AI">
  <meta property="og:title" content="Pricing AI · Local AI Software Development Estimate">
  <meta property="og:description" content="In-browser AI estimate of price range, man-months and maintenance fee, with a PDF quotation. 繁體中文 · 日本語 · English · Português · Español.">
  <meta property="og:url" content="https://pricingai.minervaelectronics.com/">
  <meta property="og:image" content="https://pricingai.minervaelectronics.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://pricingai.minervaelectronics.com/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pricing AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pricing AI · Local AI Software Development Estimate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">

<body>
  <style>
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      background:#263c5c;color:#fff;font:16px/1.5 -apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;z-index:10}
    #splash .logo{width:64px;height:64px;border-radius:14px}
    #splash .bar{width:160px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
    #splash .bar i{display:block;width:40%;height:100%;background:#fff;border-radius:99px;animation:slide 1.1s ease-in-out infinite}
    @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  </style>
  <noscript>
    <h1>Pricing AI</h1>
    <p>Local AI model software development estimate. JavaScript is required to run the estimator. Test estimate, for reference only.</p>
    <ul>
      <li><a href="/zh/" hreflang="zh-TW">繁體中文</a></li>
      <li><a href="/ja/" hreflang="ja">日本語</a></li>
      <li><a href="/en/" hreflang="en">English</a></li>
      <li><a href="/pt/" hreflang="pt-BR">Português</a></li>
      <li><a href="/es/" hreflang="es">Español</a></li>
    </ul>
  </noscript>
  <div id="splash"><img class="logo" src="icons/Icon-192.png" alt="" width="64" height="64"><div style="font-weight:700;font-size:20px">Pricing AI</div><div class="bar"><i></i></div></div>
  <script>window.addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove());</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="pdf_bridge.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="pdf_preview.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
